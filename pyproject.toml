[project]
name = "comp-579-project"
version = "0.1.0"
description = "Gymnasium stock-trading environment reproduction project."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "gymnasium>=0.29.1",
  "stable-baselines3>=2.3.2",
  "numpy>=1.26.0",
  "pandas>=2.2.0",
  "matplotlib>=3.8.0",
  "shimmy>=1.3.0",
]

[project.optional-dependencies]
cuda = [
  "torch>=2.4.0",
  "torchvision>=0.19.0",
  "torchaudio>=2.4.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.6.0",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu124", marker = "platform_system == 'Linux'" },
]
torchvision = [
  { index = "pytorch-cu124", marker = "platform_system == 'Linux'" },
]
torchaudio = [
  { index = "pytorch-cu124", marker = "platform_system == 'Linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
